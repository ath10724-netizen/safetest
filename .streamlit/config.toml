# 테마: 안전 주황을 주조색으로 하고, 라이트·다크 모두 본문 대비 4.5:1 이상을 유지한다.
# 정답(녹색)·오답(빨강)과 겹치지 않도록 주조색은 주황으로 정했다.

[theme]
font = "Pretendard Variable:https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css, sans-serif"
headingFontWeights = [800, 700]
baseRadius = "0.6rem"
showSidebarBorder = true

[theme.light]
primaryColor = "#C2410C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F5F2"
textColor = "#1F2328"
borderColor = "#E4E2DD"
linkColor = "#C2410C"

[theme.light.sidebar]
backgroundColor = "#F6F5F2"

[theme.dark]
primaryColor = "#C2410C"
backgroundColor = "#15171C"
secondaryBackgroundColor = "#1E222A"
textColor = "#E8E6E3"
borderColor = "#2F3440"
linkColor = "#FB923C"

[theme.dark.sidebar]
backgroundColor = "#1A1D23"

[client]
# 학습자에게 필요 없는 Deploy 버튼 등을 숨긴다
toolbarMode = "minimal"
